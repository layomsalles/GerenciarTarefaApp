
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: GerenciarTarefaApp-sqlserver
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Tarefa@2026"
      MSSQL_PID: "Developer"

    ports:
      - "1435:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
